
name : Typos

on:
    workflow_dispatch:

    pull_request:

    push:
        branches : [ 'main' ]


permissions:
    contents : read


jobs:

    Check:

        runs-on : ubuntu-latest

        steps:
            -   name : Checkout
                uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

            -   name : Spell Check
                uses : crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89  # v1.47.2
