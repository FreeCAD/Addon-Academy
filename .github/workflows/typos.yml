
name : Typos

on:
    workflow_dispatch:

    pull_request:

    push:
        branches : [ 'main' ]


permissions:
    contents : read


jobs:

    Check:

        runs-on : ubuntu-latest

        steps:
            -   name : Checkout
                uses : actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

            -   name : Spell Check
                uses : crate-ci/typos@5374cbf686e897b15713110e233094e2874de7ef  # v1.46.1
